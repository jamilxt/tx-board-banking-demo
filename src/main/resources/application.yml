spring:
  application:
    name: tx-board-banking-demo

  datasource:
    url: jdbc:h2:mem:bankdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Logging
logging:
  level:
    com.sdlc.pro.txboard.demo.bank: DEBUG
    org.springframework.transaction: DEBUG
